name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 2026-09-26：从 DeepSeek 官方 API 切到 OpenCode Go（订阅内额度，模型 DeepSeek V4.1 Flash）。
          # OpenCode Go 的接入要求（见 https://opencode.ai/docs/go/）：
          #   1) 客户端自带 User-Agent，而不是通用 SDK/HTTP 库的名字；
          #   2) 每个会话带稳定的 x-opencode-session，用于路由与 prompt 缓存。
          # 缺 x-opencode-session 时接口直接返回 MissingSessionID，故用 LITELLM.EXTRA_HEADERS 补上。
          config.model: "openai/deepseek-v4.1-flash"
          config.fallback_models: '["openai/deepseek-v4.1-flash"]'
          config.custom_model_max_tokens: "128000"
          OPENAI.KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENAI.API_BASE: "https://opencode.ai/zen/go/v1"
          LITELLM.EXTRA_HEADERS: '{"x-opencode-session":"pr-agent-raysview","User-Agent":"pr-agent-raysview/1.0"}'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
